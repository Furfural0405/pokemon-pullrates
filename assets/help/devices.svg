<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Ein weiteres Chat-Gerät freigeben</title><desc id="desc">Nur eigene Anfragen nach vollständigem Codevergleich bestätigen</desc><rect width="960" height="440" rx="24" fill="#101c2c"/><g font-family="system-ui,sans-serif" fill="#f3f6fc"><text x="32" y="49" font-size="26" font-weight="700">Ein weiteres Chat-Gerät freigeben</text><text x="32" y="84" font-size="18" fill="#bed0e6">Nur eigene Anfragen nach vollständigem Codevergleich bestätigen</text><rect x="32" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="48" y="163" font-size="18">Neues Gerät</text><text x="48" y="226" font-size="27" font-weight="700" fill="#88ead6">Anfrage starten</text><text x="48" y="282" font-size="16" fill="#bed0e6">DEMO · ABCD · 1234</text><rect x="336" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="352" y="163" font-size="18">Bekanntes Gerät</text><text x="352" y="226" font-size="27" font-weight="700" fill="#88ead6">Code vergleichen</text><text x="352" y="282" font-size="16" fill="#bed0e6">DEMO · ABCD · 1234</text><rect x="640" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="656" y="163" font-size="18">Codes identisch?</text><text x="656" y="226" font-size="27" font-weight="700" fill="#88ead6">Freigeben</text><text x="656" y="282" font-size="16" fill="#bed0e6">Nur bei eigener Anfrage</text><text x="32" y="385" font-size="17" fill="#bed0e6">Dies ist ein Beispiel-Gerätecode, kein persönlicher Wiederherstellungsschlüssel.</text><text x="32" y="418" font-size="13" fill="#91a8c4">SCHEMATISCHE ANSICHT · DEMODATEN</text></g></svg>