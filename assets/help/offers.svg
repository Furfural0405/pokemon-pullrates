<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Neue Pulls ergänzen, Verkäufe berücksichtigen</title><desc id="desc">20 gezogen → 16 angeboten → 3 verkauft → 13 im Angebot</desc><rect width="960" height="440" rx="24" fill="#101c2c"/><g font-family="system-ui,sans-serif" fill="#f3f6fc"><text x="32" y="49" font-size="26" font-weight="700">Neue Pulls ergänzen, Verkäufe berücksichtigen</text><text x="32" y="84" font-size="18" fill="#bed0e6">20 gezogen → 16 angeboten → 3 verkauft → 13 im Angebot</text><rect x="32" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="48" y="163" font-size="18">Pull-Stand</text><text x="48" y="226" font-size="27" font-weight="700" fill="#88ead6">20 → 25</text><text x="48" y="282" font-size="16" fill="#bed0e6">5 neue Exemplare</text><rect x="336" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="352" y="163" font-size="18">Aktuelles Angebot</text><text x="352" y="226" font-size="27" font-weight="700" fill="#88ead6">13</text><text x="352" y="282" font-size="16" fill="#bed0e6">Verkäufe bereits abgezogen</text><rect x="640" y="120" width="288" height="220" rx="16" fill="#1c3048" stroke="#385572"/><text x="656" y="163" font-size="18">Neuer Vorschlag</text><text x="656" y="226" font-size="27" font-weight="700" fill="#88ead6">13 + 5 = 18</text><text x="656" y="282" font-size="16" fill="#bed0e6">Vor Übernahme bearbeitbar</text><text x="32" y="385" font-size="17" fill="#bed0e6">Deine Pull-Liste bleibt unverändert. Ohne neue Pulls erhöht sich das Angebot nicht.</text><text x="32" y="418" font-size="13" fill="#91a8c4">SCHEMATISCHE ANSICHT · DEMODATEN</text></g></svg>
